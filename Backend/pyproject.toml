[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simunow-worker"
version = "0.1.0"
description = "SimuNow orchestration boundary: project contracts, environment probes, L0 representative-day runs; L1/L2/L3 engines are not configured"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
test = ["jsonschema==4.26.0"]

[project.scripts]
simunow-worker = "simunow_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simunow_worker.runtime" = ["manifest.json"]
